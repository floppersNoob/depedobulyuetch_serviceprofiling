[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.mbstring", "php82Extensions.exif", "php82Extensions.pcntl", "php82Extensions.bcmath", "php82Extensions.gd", "nodejs_20", "npm-9_x"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts",
    "npm ci",
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[phases.release]
cmds = [
    "mkdir -p /var/www/html/database",
    "touch /var/www/html/database/database.sqlite",
    "php artisan migrate --force || true"
]

[start]
cmds = ["php artisan serve --host 0.0.0.0 --port 80"]
