[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sed -i 's/Listen 80/Listen '\"$PORT\"'/' /etc/apache2/ports.conf && apache2-foreground"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.env]
APP_NAME = "DPWH_ServiceProfiling"
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "sqlite"
DB_DATABASE = "/var/www/html/database/database.sqlite"
SESSION_DRIVER = "cookie"
CACHE_STORE = "file"
QUEUE_CONNECTION = "sync"
LOG_CHANNEL = "stderr"
