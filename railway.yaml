services:
  web:
    build:
      dockerfilePath: Dockerfile
    ports:
      - port: 80
        targetPort: 80
    volumes:
      - volume: data
        mountPath: /var/www/html/database
    env:
      APP_NAME: "DPWH_ServiceProfiling"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "${RAILWAY_PUBLIC_DOMAIN}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    healthcheck:
      path: /health
      port: 80
      interval: 10s
      timeout: 5s
      retries: 3
