services:
  - type: web
    name: dpwh-serviceprofiling
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: DPWH_ServiceProfiling
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://dpwh-serviceprofiling.onrender.com
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: PORT
        value: 10000
    disk:
      name: sqlite-data
      mountPath: /var/www/html/database
      sizeGB: 1
